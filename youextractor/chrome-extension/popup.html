<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0a1022;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .logo {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.2px;
    }

    .badge {
      font-size: 9px;
      padding: 1px 6px;
      background: rgba(168,85,247,.15);
      color: #c084fc;
      border-radius: 999px;
      margin-left: auto;
      font-weight: 600;
    }

    .video-info {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .video-title {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      color: #f1f5f9;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 10px;
      color: #64748b;
      margin-top: 3px;
    }

    .extract-btn {
      width: 100%;
      background: linear-gradient(90deg, #a855f7, #c084fc);
      color: white;
      border: none;
      padding: 11px 14px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 2px 8px rgba(168,85,247,0.3);
    }

    .extract-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(168,85,247,0.45);
    }

    .extract-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      margin: 9px 0 2px;
      font-size: 10.5px;
      text-align: center;
      color: #64748b;
      min-height: 14px;
    }

    .features {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #1e293b;
      font-size: 10px;
      color: #64748b;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 8px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .feature:before {
      content: "✓";
      color: #22c55e;
      font-size: 9px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon128.png" class="logo" alt="YouExtractor">
    <div class="title">YouExtractor</div>
    <div class="badge">FREE</div>
  </div>

  <div id="video-info" class="video-info" style="display: none;">
    <div id="video-title" class="video-title"></div>
    <div class="video-meta">Ready to turn into full project + guide</div>
  </div>

  <button id="extractBtn" class="extract-btn">Loading...</button>
  <p id="status" class="status"></p>

  <div class="features">
    <div class="feature">Complete code files</div>
    <div class="feature">Step-by-step guide</div>
    <div class="feature">Interactive roadmap</div>
    <div class="feature">AI tutor chat</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
