services:
  - type: web
    name: youextractor
    env: docker
    plan: free
    dockerfilePath: ./youextractor/Dockerfile
    dockerContext: ./youextractor
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: base64:b6fkKEA46O4acYzBOAd8g2sXaC0y7D28zSwzuhXocWw=
      - key: APP_URL
        value: https://youextractor.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: youextractor
          property: host
      - key: DB_PORT
        fromDatabase:
          name: youextractor
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: youextractor
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: youextractor
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: youextractor
          property: password
      - key: DB_SSLMODE
        value: require
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: QUEUE_CONNECTION
        value: sync
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://youextractor.onrender.com/auth/google/callback

databases:
  - name: youextractor
    plan: free
    ipAllowList: []