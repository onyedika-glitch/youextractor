server {
    listen 80;
    server_name youextractor.me www.youextractor.me;

    # Outrank-hosted articles at youextractor.me/articles (everything else goes to Laravel)
    location = /articles {
        proxy_pass https://o--631ed0b6-869e-4965-a662-57432f76e7c6.outrankblog.com/;
        proxy_set_header Host o--631ed0b6-869e-4965-a662-57432f76e7c6.outrankblog.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /articles/ {
        proxy_pass https://o--631ed0b6-869e-4965-a662-57432f76e7c6.outrankblog.com/;
        proxy_set_header Host o--631ed0b6-869e-4965-a662-57432f76e7c6.outrankblog.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
